name: Donchian 4H alerts

on:
  schedule:
    - cron: "7 * * * *"        # every hour at :07 UTC (4H candles close at 00, 04, 08, 12, 16, 20 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "test = send the current status now"
        type: choice
        options: [test, auto, summary]
        default: test

concurrency:
  group: donchian-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # remembers which alerts were already sent, so each one arrives only once
      - uses: actions/cache/restore@v4
        with:
          path: .alert-state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Check signals and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: node alerts/run.mjs

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .alert-state
          key: alert-state-${{ github.run_id }}
