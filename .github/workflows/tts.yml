name: Voice-over test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q transformers scipy edge-tts uroman
      - name: Make the voice-overs
        run: python research/tts.py
      - name: Save them to the "media" branch
        run: |
          mkdir -p /tmp/out && cp media/* /tmp/out/
          git config user.name "media-bot" && git config user.email "media-bot@users.noreply.github.com"
          git checkout --orphan media-tmp && git rm -rq --cached . && rm -rf ./*
          cp /tmp/out/* . && git add . && git commit -qm "voice-over test $(date -u +%F' '%H:%M)" && git push -fq origin HEAD:refs/heads/media
