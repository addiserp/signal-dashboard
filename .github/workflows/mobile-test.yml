name: Mobile view test
on:
  workflow_dispatch:
    inputs:
      script:
        default: mobile.mjs
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i --no-save playwright@1.48.2
      - run: node research/${{ github.event.inputs.script || 'mobile.mjs' }}
      - name: Save screenshots to the "mobile-snaps" branch
        run: |
          mkdir -p /tmp/out && cp snaps/* /tmp/out/
          git config user.name "snapshot-bot" && git config user.email "snapshot-bot@users.noreply.github.com"
          git checkout --orphan ms-tmp && git rm -rq --cached . && rm -rf ./*
          cp /tmp/out/* . && git add *.jpg && git commit -qm "mobile snaps" && git push -fq origin HEAD:refs/heads/mobile-snaps
