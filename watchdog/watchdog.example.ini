; Copy this file to watchdog.ini (same folder) and fill in your values.
; watchdog.ini is private: it holds your OBS password and Telegram token. Never upload it.

[obs]
; OBS -> Tools -> WebSocket Server Settings: tick "Enable WebSocket server", port 4455, set a password
host = localhost
port = 4455
password = PUT-YOUR-OBS-WEBSOCKET-PASSWORD
; how to start OBS. --startstreaming makes it go live by itself after a restart.
launch_cmd = obs --startstreaming --disable-shutdown-check --minimize-to-tray
; flatpak OBS instead:
; launch_cmd = flatpak run com.obsproject.Studio --startstreaming --disable-shutdown-check --minimize-to-tray
process_name = obs
; seconds to wait for OBS to open after a restart
start_wait_sec = 40

[youtube]
; the channel that carries this stream (its /live page is checked)
channel = https://www.youtube.com/@addis-chart-signals
; no = only watch OBS
check = yes

[check]
; seconds between checks
interval_sec = 60
; how many checks in a row must fail before acting (3 x 60 s = 3 minutes)
confirm = 3
; after any restart, wait this long before judging again (YouTube needs 1-2 minutes to show "live")
grace_sec = 180
; YouTube offline while OBS streams: restart the stream this many times, then restart OBS itself
stream_restarts_before_obs_restart = 2
; safety limit so a broken setup does not restart OBS forever
max_obs_restarts_per_hour = 4
; when restarting: seconds to wait after stopping the stream (or closing OBS) before going live again,
; so YouTube ends the old broadcast and is ready for a new one
youtube_reset_sec = 60

[telegram]
; optional: get a message on every restart. Leave empty to turn off.
; use a private chat with your bot (send /start to it, then your chat id from @userinfobot)
bot_token =
chat_id =

[log]
file = watchdog.log
